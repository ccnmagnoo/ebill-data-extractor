[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ebill-extractor"
version = "0.1.0"
description = "Extractor de parametros de boletas electricas chilenas en PDF"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "ebill-extractor" }]
keywords = ["chile", "electricidad", "boletas", "facturas", "pdf", "chilquinta", "facturacion"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Office/Business",
    "Topic :: Utilities",
]
dependencies = [
    "pdfplumber>=0.10",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ebill-extractor = "ebill_extractor.cli:main"
extraer-boletas = "ebill_extractor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ebill_extractor = ["py.typed"]
